<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovaStream IPTV — Diagnostic Edition</title>
  
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(23, 32, 54, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --error: #ef4444;
      --success: #22c55e;
      --warn: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    #sidebar {
      width: 360px;
      min-width: 320px;
      background: #0f172a;
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .header-box {
      padding: 14px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
    }
    .brand i { color: var(--accent); font-size: 1.3rem; }

    .source-selectors {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    select, input, button {
      background: #1e293b;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      outline: none;
    }
    select:focus, input:focus { border-color: var(--accent); }
    button { cursor: pointer; transition: 0.2s; }
    button:hover { background: #334155; }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-box input { width: 100%; padding-left: 28px; }
    .search-box i { position: absolute; left: 8px; color: var(--text-muted); }

    .status-toast {
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 18px;
    }

    .channel-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .channel-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: var(--card-bg);
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
    }
    .channel-card:hover { background: #1e293b; }
    .channel-card.active {
      background: rgba(56, 189, 248, 0.12);
      border-color: var(--accent);
    }

    .logo-container {
      width: 36px;
      height: 36px;
      background: #020617;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    .logo-container img { width: 100%; height: 100%; object-fit: contain; }

    .meta-info { flex: 1; min-width: 0; }
    .ch-title {
      font-weight: 600;
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ch-group {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #020617;
      overflow-y: auto;
    }

    .player-container {
      position: relative;
      width: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      max-height: 60vh;
    }
    video {
      width: 100%;
      max-height: 60vh;
      aspect-ratio: 16/9;
      background: #000;
    }

    .details-pane {
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .now-playing {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
    }
    .channel-focus-name { font-size: 1.25rem; font-weight: 700; }
    .channel-badge {
      background: #1e293b;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      color: var(--accent);
      border: 1px solid var(--card-border);
    }

    /* Diagnostics & Trace Panel */
    .diag-container {
      background: #080c14;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.75rem;
    }
    .diag-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      color: var(--text-muted);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding-bottom: 6px;
    }
    .diag-logs {
      max-height: 140px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .log-entry { line-height: 1.4; word-break: break-all; }
    .log-info { color: #94a3b8; }
    .log-warn { color: var(--warn); }
    .log-error { color: var(--error); font-weight: bold; }
    .log-success { color: var(--success); }

    /* EPG Schedule Section */
    .epg-section h4 {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .epg-list { display: flex; flex-direction: column; gap: 6px; }
    .epg-item {
      display: flex;
      gap: 12px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      padding: 10px;
      border-radius: 6px;
    }
    .epg-item.current {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.05);
    }
    .epg-time {
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--accent);
      min-width: 80px;
    }
    .epg-info h5 { font-size: 0.85rem; margin-bottom: 2px; }
    .epg-info p { font-size: 0.75rem; color: var(--text-muted); }
  </style>
</head>
<body>

  <!-- Channel Sidebar -->
  <div id="sidebar">
    <div class="header-box">
      <div class="brand">
        <i class="ph-bold ph-television"></i>
        <span>NovaStream</span>
      </div>

      <div class="source-selectors">
        <select id="countrySelect" onchange="loadPresetFeed()">
          <option value="id">Indonesia (ID)</option>
          <option value="animation">Animation / Cartoons</option>
          <option value="us">United States (US)</option>
          <option value="uk">United Kingdom (UK)</option>
          <option value="jp">Japan (JP)</option>
          <option value="news">News</option>
        </select>

        <select id="proxySelect" onchange="loadPresetFeed()">
          <option value="direct">Direct (No Proxy)</option>
          <option value="https://corsproxy.io/?">Proxy: Corsproxy</option>
          <option value="https://api.allorigins.win/raw?url=">Proxy: AllOrigins</option>
        </select>
      </div>

      <div class="search-box">
        <i class="ph ph-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search channel name or group..." oninput="filterChannels()" />
      </div>

      <div class="status-toast" id="epgStatusText">Ready</div>
    </div>

    <div class="channel-list" id="channelList"></div>
  </div>

  <!-- Main View -->
  <div id="main">
    <div class="player-container">
      <video id="videoPlayer" controls autoplay></video>
    </div>

    <div class="details-pane">
      <div class="now-playing">
        <div>
          <div class="channel-focus-name" id="currentChTitle">Select a channel</div>
          <div style="font-size:0.75rem; color:var(--text-muted);" id="currentChTvgId">tvg-id: -</div>
        </div>
        <div class="channel-badge" id="currentChGroup">Idle</div>
      </div>

      <!-- Diagnostic Console -->
      <div class="diag-container">
        <div class="diag-header">
          <span><i class="ph-bold ph-bug"></i> Live Track Diagnostics</span>
          <button onclick="clearLogs()" style="padding: 2px 8px; font-size: 0.7rem;">Clear</button>
        </div>
        <div class="diag-logs" id="diagLogs"></div>
      </div>

      <!-- EPG Program Guide -->
      <div class="epg-section">
        <h4><i class="ph-bold ph-calendar-blank"></i> Electronic Program Guide (EPGShare01 / iptv-org)</h4>
        <div class="epg-list" id="epgProgrammes">
          <div style="color:var(--text-muted); font-size: 0.8rem;">Select a channel with valid tvg-id to view guide.</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- Diagnostics & Logger ---
    function logMsg(msg, type = 'info') {
      const logs = document.getElementById('diagLogs');
      const time = new Date().toLocaleTimeString();
      const div = document.createElement('div');
      div.className = `log-entry log-${type}`;
      div.innerHTML = `[${time}] ${msg}`;
      logs.appendChild(div);
      logs.scrollTop = logs.scrollHeight;
      console[type === 'error' ? 'error' : type === 'warn' ? 'warn' : 'log'](msg);
    }

    function clearLogs() {
      document.getElementById('diagLogs').innerHTML = '';
      logMsg('Console cleared.', 'info');
    }

    window.onerror = function(msg, url, line) {
      logMsg(`Uncaught Error: ${msg} (${url}:${line})`, 'error');
    };

    // --- State & Config ---
    const video = document.getElementById('videoPlayer');
    let hls = new Hls();
    let channels = [];
    let activeChannel = null;
    let epgDatabase = {};

    const STREAMS_MAP = {
      'id': 'https://iptv-org.github.io/iptv/countries/id.m3u',
      'animation': 'https://iptv-org.github.io/iptv/categories/animation.m3u',
      'us': 'https://iptv-org.github.io/iptv/countries/us.m3u',
      'uk': 'https://iptv-org.github.io/iptv/countries/uk.m3u',
      'jp': 'https://iptv-org.github.io/iptv/countries/jp.m3u',
      'news': 'https://iptv-org.github.io/iptv/categories/news.m3u'
    };

    function getProxiedUrl(targetUrl) {
      const mode = document.getElementById('proxySelect').value;
      if (mode === 'direct') return targetUrl;
      return `${mode}${encodeURIComponent(targetUrl)}`;
    }

    // --- Core Pipeline ---
    async function loadPresetFeed() {
      const selection = document.getElementById('countrySelect').value;
      const m3uUrl = STREAMS_MAP[selection];
      const statusText = document.getElementById('epgStatusText');

      logMsg(`Initiating playlist fetch for [${selection}]: ${m3uUrl}`, 'info');
      statusText.textContent = 'Fetching playlist...';

      try {
        // Direct fetch without proxy for GitHub Pages/CDN (CORS is native on GitHub)
        let response = await fetch(m3uUrl).catch(async (e) => {
          logMsg(`Direct fetch failed, falling back to proxy: ${e.message}`, 'warn');
          return await fetch(getProxiedUrl(m3uUrl));
        });

        if (!response.ok) throw new Error(`HTTP ${response.status} ${response.statusText}`);

        const data = await response.text();
        parseM3U(data);
        logMsg(`Successfully parsed ${channels.length} channels for [${selection}]`, 'success');
        statusText.textContent = `Loaded ${channels.length} channels`;

        // Attempt EPG
        loadEpgForSelection(selection);
      } catch (err) {
        logMsg(`Playlist load error: ${err.message}`, 'error');
        statusText.textContent = 'Playlist error. Check diagnostic log below.';
      }
    }

    function parseM3U(text) {
      channels = [];
      const lines = text.split('\n');
      let currentItem = {};

      lines.forEach(line => {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
          const tvgId = (line.match(/tvg-id="([^"]+)"/) || [])[1] || '';
          const logo = (line.match(/tvg-logo="([^"]+)"/) || [])[1] || '';
          const group = (line.match(/group-title="([^"]+)"/) || [])[1] || 'General';
          const name = (line.match(/,(.*)$/) || [])[1] || 'Unknown Channel';

          currentItem = { tvgId, logo, group, name };
        } else if (line.startsWith('http://') || line.startsWith('https://')) {
          currentItem.url = line;
          channels.push({ ...currentItem });
          currentItem = {};
        }
      });

      document.getElementById('searchInput').value = '';
      renderChannelList(channels);
      if (channels.length > 0) playChannel(channels[0]);
    }

    function renderChannelList(list) {
      const container = document.getElementById('channelList');
      container.innerHTML = '';

      if (list.length === 0) {
        container.innerHTML = '<div style="color:var(--text-muted); padding:12px; font-size:0.8rem;">No channels match your query. Clear search.</div>';
        return;
      }

      list.forEach(ch => {
        const card = document.createElement('div');
        card.className = `channel-card ${activeChannel && activeChannel.url === ch.url ? 'active' : ''}`;
        card.innerHTML = `
          <div class="logo-container">
            ${ch.logo ? `<img src="${ch.logo}" onerror="this.remove()" />` : ''}
            <i class="ph ph-tv" style="${ch.logo ? 'display:none;' : ''}"></i>
          </div>
          <div class="meta-info">
            <div class="ch-title">${ch.name}</div>
            <div class="ch-group">${ch.group}</div>
          </div>
        `;
        card.onclick = () => {
          playChannel(ch);
          document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
        };
        container.appendChild(card);
      });
    }

    // --- Stream Player with Live Tracing ---
    function playChannel(ch) {
      activeChannel = ch;
      document.getElementById('currentChTitle').textContent = ch.name;
      document.getElementById('currentChGroup').textContent = ch.group;
      document.getElementById('currentChTvgId').textContent = `tvg-id: ${ch.tvgId || 'None'}`;

      displayEpgForChannel(ch.tvgId);

      logMsg(`Starting stream: ${ch.name}`, 'info');
      logMsg(`URL: ${ch.url}`, 'info');

      if (ch.url.startsWith('http://') && window.location.protocol === 'https:') {
        logMsg('Blocked Mixed Active Content: Browsers reject HTTP streams on HTTPS sites!', 'error');
      }

      if (Hls.isSupported()) {
        hls.destroy();
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true
        });

        hls.loadSource(ch.url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, (e, data) => {
          logMsg(`HLS Manifest loaded (${data.levels.length} quality levels detected)`, 'success');
          video.play().catch(e => logMsg(`Autoplay blocked: ${e.message}. Click play manually.`, 'warn'));
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                logMsg(`Fatal Network Error: Likely stream dead or CORS blocked: ${data.details}`, 'error');
                hls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                logMsg(`Fatal Media Error: Corrupt stream chunks (${data.details}). Attempting recover.`, 'warn');
                hls.recoverMediaError();
                break;
              default:
                logMsg(`Unrecoverable playback error: ${data.details}`, 'error');
                hls.destroy();
                break;
            }
          } else {
            logMsg(`HLS Warning: ${data.details}`, 'warn');
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = ch.url;
        video.play().catch(e => logMsg(`Native play error: ${e.message}`, 'warn'));
      }
    }

    // --- EPG Fetcher (Safely Managed) ---
    async function loadEpgForSelection(countryCode) {
      if (countryCode !== 'id' && countryCode !== 'us') {
        document.getElementById('epgStatusText').textContent = 'EPG not configured for this category';
        return;
      }

      logMsg(`Requesting EPG for [${countryCode}]...`, 'info');
      
      // EPGShare01 raw files are large; we route through proxy with timeout protection
      const epgUrl = `https://epgshare01.online/epgshare01/epg_ripper_${countryCode.toUpperCase()}1.xml.gz`;
      const target = getProxiedUrl(epgUrl);

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 12000); // 12s timeout

        const res = await fetch(target, { signal: controller.signal });
        clearTimeout(timeoutId);

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const buf = await res.arrayBuffer();
        logMsg(`Downloaded ${Math.round(buf.byteLength / 1024)} KB of EPG data. Decompressing...`, 'info');

        const uncompressed = pako.ungzip(new Uint8Array(buf), { to: 'string' });
        parseXMLTV(uncompressed);
        logMsg('EPG parsed and indexed successfully.', 'success');
        if (activeChannel) displayEpgForChannel(activeChannel.tvgId);
      } catch (e) {
        logMsg(`EPG fetch skipped: ${e.message} (Stream player remains fully functional).`, 'warn');
      }
    }

    function parseXMLTV(xmlString) {
      epgDatabase = {};
      const parser = new DOMParser();
      const doc = parser.parseFromString(xmlString, "application/xml");
      const programmes = doc.querySelectorAll('programme');

      programmes.forEach(node => {
        const channelId = node.getAttribute('channel');
        const startRaw = node.getAttribute('start');
        const stopRaw = node.getAttribute('stop');
        const title = node.querySelector('title')?.textContent || 'Show';
        const desc = node.querySelector('desc')?.textContent || '';

        if (!epgDatabase[channelId]) epgDatabase[channelId] = [];

        epgDatabase[channelId].push({
          start: parseXmlDate(startRaw),
          stop: parseXmlDate(stopRaw),
          title,
          desc
        });
      });
    }

    function parseXmlDate(dateStr) {
      if (!dateStr) return null;
      const year = dateStr.slice(0, 4);
      const month = dateStr.slice(4, 6) - 1;
      const day = dateStr.slice(6, 8);
      const hours = dateStr.slice(8, 10);
      const minutes = dateStr.slice(10, 12);
      return new Date(Date.UTC(year, month, day, hours, minutes));
    }

    function formatTime(d) {
      if (!d) return '--:--';
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function displayEpgForChannel(tvgId) {
      const container = document.getElementById('epgProgrammes');
      container.innerHTML = '';

      if (!tvgId || !epgDatabase[tvgId] || epgDatabase[tvgId].length === 0) {
        container.innerHTML = `<div style="color:var(--text-muted); font-size:0.8rem;">No schedule available for tvg-id: "${tvgId || 'None'}"</div>`;
        return;
      }

      const list = epgDatabase[tvgId];
      const now = new Date();

      list.slice(0, 6).forEach(prog => {
        const isCurrent = prog.start && prog.stop && now >= prog.start && now <= prog.stop;
        const item = document.createElement('div');
        item.className = `epg-item ${isCurrent ? 'current' : ''}`;
        item.innerHTML = `
          <div class="epg-time">${formatTime(prog.start)} - ${formatTime(prog.stop)}</div>
          <div class="epg-info">
            <h5>${prog.title} ${isCurrent ? '<span style="color:var(--accent); font-size:0.7rem;">(LIVE)</span>' : ''}</h5>
            <p>${prog.desc || 'No description available.'}</p>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function filterChannels() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      if (!query) {
        renderChannelList(channels);
        return;
      }
      const filtered = channels.filter(c => 
        c.name.toLowerCase().includes(query) || 
        c.group.toLowerCase().includes(query)
      );
      renderChannelList(filtered);
    }

    window.onload = () => {
      logMsg('App initialized. Starting automatic boot sequence...', 'info');
      loadPresetFeed();
    };
  </script>
</body>
</html>
