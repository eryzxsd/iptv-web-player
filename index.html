<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Minimal IPTV Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; display: flex; height: 100vh; margin: 0; }
    #sidebar { width: 320px; background: #1e1e1e; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    #main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    video { width: 90%; max-height: 80vh; background: #000; border-radius: 8px; }
    textarea { width: 100%; height: 80px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 8px; box-sizing: border-box; }
    button { background: #0070f3; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
    .channel-item { padding: 10px; background: #2a2a2a; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .channel-item:hover { background: #3a3a3a; }
    .channel-item img { width: 24px; height: 24px; object-fit: contain; }
  </style>
</head>
<body>
  <div id="sidebar">
    <h3>IPTV Channels</h3>
    <textarea id="m3uInput" placeholder="Paste #EXTM3U playlist content here..."></textarea>
    <button onclick="parsePlaylist()">Load Playlist</button>
    <div id="channelList" style="display:flex; flex-direction:column; gap:8px;"></div>
  </div>

  <div id="main">
    <video id="videoPlayer" controls autoplay></video>
  </div>

  <script>
    const video = document.getElementById('videoPlayer');
    let hls = new Hls();

    function playStream(url) {
      if (Hls.isSupported()) {
        hls.destroy();
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play();
      }
    }

    function parsePlaylist() {
      const text = document.getElementById('m3uInput').value;
      const lines = text.split('\n');
      const listContainer = document.getElementById('channelList');
      listContainer.innerHTML = '';

      let currentName = 'Unknown Channel';
      let currentLogo = '';

      lines.forEach(line => {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
          const nameMatch = line.match(/,(.*)$/);
          const logoMatch = line.match(/tvg-logo="([^"]+)"/);
          currentName = nameMatch ? nameMatch[1] : 'Channel';
          currentLogo = logoMatch ? logoMatch[1] : '';
        } else if (line.startsWith('http://') || line.startsWith('https://')) {
          const streamUrl = line;
          const btn = document.createElement('div');
          btn.className = 'channel-item';
          btn.innerHTML = `${currentLogo ? `<img src="${currentLogo}" />` : ''} <span>${currentName}</span>`;
          btn.onclick = () => playStream(streamUrl);
          listContainer.appendChild(btn);
        }
      });
    }
  </script>
</body>
</html>
