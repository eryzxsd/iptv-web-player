<script>
  const video = document.getElementById('videoPlayer');
  let hls = new Hls();
  let channels = [];
  let activeChannel = null;
  let epgDatabase = {};

  // iptv-org public CDN links (Native CORS supported, no proxy required for playlist)
  const IPTV_ORG_STREAMS = {
    'id': 'https://iptv-org.github.io/iptv/countries/id.m3u',
    'us': 'https://iptv-org.github.io/iptv/countries/us.m3u',
    'uk': 'https://iptv-org.github.io/iptv/countries/uk.m3u',
    'jp': 'https://iptv-org.github.io/iptv/countries/jp.m3u',
    'animation': 'https://iptv-org.github.io/iptv/categories/animation.m3u',
    'news': 'https://iptv-org.github.io/iptv/categories/news.m3u',
    'sports': 'https://iptv-org.github.io/iptv/categories/sports.m3u'
  };

  // EPG sources (using iptv-org's uncompressed direct CORS-friendly feeds as fallback)
  const EPG_MAP = {
    'id': 'https://epgshare01.online/epgshare01/epg_ripper_ID1.xml.gz',
    'us': 'https://epgshare01.online/epgshare01/epg_ripper_US1.xml.gz'
  };

  function getProxyUrl(url) {
    const mode = document.getElementById('proxySelect').value;
    if (mode === 'direct') return url;
    return `${mode}${encodeURIComponent(url)}`;
  }

  async function loadPresetFeed() {
    const selection = document.getElementById('countrySelect').value;
    const m3uUrl = IPTV_ORG_STREAMS[selection] || `https://iptv-org.github.io/iptv/countries/${selection}.m3u`;
    const statusText = document.getElementById('epgStatusText');

    statusText.textContent = 'Fetching Playlist...';

    try {
      // GitHub Pages / iptv-org github CDN has native CORS; fetch directly first
      let response;
      try {
        response = await fetch(m3uUrl);
      } catch (e) {
        response = await fetch(getProxyUrl(m3uUrl));
      }

      const data = await response.text();
      parseM3U(data);

      if (EPG_MAP[selection]) {
        loadEpgFeed(EPG_MAP[selection]);
      } else {
        statusText.textContent = 'Playlist loaded (No EPG available for category)';
      }
    } catch (err) {
      statusText.textContent = 'Failed to load playlist.';
      console.error(err);
    }
  }

  function parseM3U(text) {
    channels = [];
    const lines = text.split('\n');
    let currentItem = {};

    lines.forEach(line => {
      line = line.trim();
      if (line.startsWith('#EXTINF:')) {
        const tvgId = (line.match(/tvg-id="([^"]+)"/) || [])[1] || '';
        const logo = (line.match(/tvg-logo="([^"]+)"/) || [])[1] || '';
        const group = (line.match(/group-title="([^"]+)"/) || [])[1] || 'General';
        const name = (line.match(/,(.*)$/) || [])[1] || 'Unknown Channel';

        currentItem = { tvgId, logo, group, name };
      } else if (line.startsWith('http://') || line.startsWith('https://')) {
        currentItem.url = line;
        channels.push({ ...currentItem });
        currentItem = {};
      }
    });

    // Reset search bar when loading a new playlist
    document.getElementById('searchInput').value = '';
    renderChannelList(channels);
    if (channels.length > 0) playChannel(channels[0]);
  }

  async function loadEpgFeed(epgUrl) {
    const statusText = document.getElementById('epgStatusText');
    statusText.textContent = 'Downloading EPG data...';

    try {
      // Route via proxy because epgshare01 lacks wild-card CORS headers
      const proxiedUrl = getProxyUrl(epgUrl);
      const response = await fetch(proxiedUrl);
      
      if (!response.ok) throw new Error(`Proxy status: ${response.status}`);

      const arrayBuffer = await response.arrayBuffer();
      statusText.textContent = 'Decompressing (.gz)...';
      
      const uncompressed = pako.ungzip(new Uint8Array(arrayBuffer), { to: 'string' });
      statusText.textContent = 'Indexing guide...';
      
      parseXMLTV(uncompressed);
      statusText.textContent = 'EPG Active';
      if (activeChannel) displayEpgForChannel(activeChannel.tvgId);
    } catch (err) {
      statusText.textContent = 'EPG proxy limit exceeded. Stream will play without guide.';
      console.warn('EPG fetch bypassed:', err);
    }
  }

  function parseXMLTV(xmlString) {
    epgDatabase = {};
    const parser = new DOMParser();
    const doc = parser.parseFromString(xmlString, "application/xml");
    const programmes = doc.querySelectorAll('programme');

    programmes.forEach(node => {
      const channelId = node.getAttribute('channel');
      const startRaw = node.getAttribute('start');
      const stopRaw = node.getAttribute('stop');
      const title = node.querySelector('title')?.textContent || 'Show';
      const desc = node.querySelector('desc')?.textContent || '';

      if (!epgDatabase[channelId]) epgDatabase[channelId] = [];

      epgDatabase[channelId].push({
        start: parseXmlDate(startRaw),
        stop: parseXmlDate(stopRaw),
        title,
        desc
      });
